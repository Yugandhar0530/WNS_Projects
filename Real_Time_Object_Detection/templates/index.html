<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Object Detection</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, sans-serif;
            background: #121820;
            color: #e8eef5;
            margin: 0;
            padding: 24px;
        }
        .wrap {
            max-width: 920px;
            margin: 0 auto;
            background: #1c2633;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.75rem;
        }
        .subtitle {
            color: #9aabb8;
            margin-bottom: 20px;
        }
        .meta {
            font-size: 0.9rem;
            color: #7dd3a8;
            margin-bottom: 16px;
        }
        .feed {
            border: 3px solid #2f3f52;
            border-radius: 8px;
            overflow: hidden;
            line-height: 0;
        }
        .feed img {
            width: 100%;
            max-width: 860px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Real-Time Object Detection</h1>
        <p class="subtitle">YOLOv8 live inference from your webcam, served with Flask and OpenCV.</p>
        <p class="meta">Confidence filter: {{ confidence }}</p>
        <div class="feed">
            <img src="{{ url_for('video_feed') }}" alt="Webcam detection stream">
        </div>
    </div>
</body>
</html>
